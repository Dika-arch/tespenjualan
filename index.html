<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mobile Finance UI</title>
  <meta name="description" content="Prototype UI mobile finance untuk pengujian tampilan HP." />
  <meta name="theme-color" content="#0073d8" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --blue-900: #004682;
      --blue-800: #0059ad;
      --blue-700: #0071d4;
      --blue-600: #0788ec;
      --blue-soft: #e9f6ff;
      --green: #16be76;
      --orange: #ff8a00;
      --pink: #ef6cae;
      --text: #172331;
      --muted: #8a96a3;
      --bg: #f4f8fc;
      --line: #edf2f7;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; background: var(--bg); }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }
    button { border: 0; background: transparent; font: inherit; cursor: pointer; }
    svg { display: block; }

    .app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      padding-bottom: calc(94px + var(--safe-bottom));
      overflow-x: hidden;
      position: relative;
    }

    .hero {
      position: relative;
      min-height: 188px;
      padding: 18px 18px 34px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(5, 67, 118, .16), rgba(0, 88, 170, .82)),
        linear-gradient(135deg, #7c2838 0%, #3c4464 42%, #0a84de 100%);
      overflow: visible;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 64% 9%, rgba(255, 180, 53, .76), transparent 13%),
        linear-gradient(90deg, transparent 0 6%, rgba(0,0,0,.16) 6% 11%, transparent 11% 25%, rgba(0,0,0,.16) 25% 34%, transparent 34% 48%, rgba(0,0,0,.22) 48% 54%, transparent 54%),
        linear-gradient(140deg, transparent 0 58%, rgba(0,0,0,.20) 58% 66%, transparent 66%);
      opacity: .85;
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .profile {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }

    .brand {
      width: 58px;
      padding-top: 1px;
      font-weight: 950;
      font-size: 25px;
      letter-spacing: -1.4px;
      line-height: .76;
    }
    .brand small {
      display: block;
      font-size: 22px;
      letter-spacing: -1.8px;
    }

    .greeting {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.22;
      text-shadow: 0 1px 8px rgba(0,0,0,.18);
      padding-top: 2px;
    }
    .greeting strong {
      display: block;
      font-size: 20px;
      font-weight: 950;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
    }

    .top-icon {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: white;
      background: rgba(255, 255, 255, .10);
      backdrop-filter: blur(6px);
    }

    .help {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 9px;
      color: #fff;
      border-radius: 999px;
      background: rgba(0, 48, 95, .26);
      font-size: 11px;
      font-weight: 900;
      line-height: .95;
      backdrop-filter: blur(6px);
    }

    .main-card {
      position: relative;
      z-index: 3;
      margin: -64px 18px 0;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(30, 70, 110, .18);
      overflow: hidden;
    }

    .blue-balance {
      margin: 14px;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(180deg, #025db2 0%, #004991 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
      overflow: hidden;
    }

    .balance-top { padding: 22px 20px 18px; }
    .label { color: rgba(255,255,255,.66); font-size: 14px; font-weight: 760; margin-bottom: 16px; }
    .masked {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 29px;
      font-weight: 950;
      letter-spacing: -.5px;
    }
    .eye {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.92);
      color: #0063b6;
      letter-spacing: 0;
    }
    .rekening {
      border-top: 1px solid rgba(255,255,255,.16);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 19px;
      font-weight: 950;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px 12px 24px;
    }
    .quick-item, .feature-item {
      display: grid;
      justify-items: center;
      gap: 10px;
      text-align: center;
      color: #1b2531;
      font-size: 15px;
      font-weight: 950;
      line-height: 1.18;
    }

    .quick-icon, .feature-icon {
      width: 58px;
      height: 58px;
      border-radius: 19px;
      display: grid;
      place-items: center;
      background: #e8f5ff;
      color: #0b87de;
      box-shadow: 0 7px 14px rgba(14, 102, 180, .08);
      position: relative;
    }
    .quick-icon.green, .feature-icon.green { background: #e4f9ef; color: #0fbf72; }
    .quick-icon.pink, .feature-icon.pink { background: #ffe8f5; color: #ef6cae; }
    .feature-icon.orange { background: #fff2dc; color: #ff9a19; }

    .promo {
      margin: 22px 18px 18px;
      min-height: 74px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 88% 22%, rgba(255,255,255,.28), transparent 25%),
        linear-gradient(110deg, #ff9508, #ff7a00);
      box-shadow: 0 10px 22px rgba(255, 126, 0, .23);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px 13px 20px;
      overflow: hidden;
    }
    .promo strong { display: block; font-size: 16px; font-weight: 950; margin-bottom: 6px; }
    .promo span { display: block; font-size: 12px; opacity: .92; font-weight: 700; }
    .promo-cta {
      flex: 0 0 auto;
      min-width: 84px;
      height: 42px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.92);
      color: #e56f00;
      font-weight: 950;
      box-shadow: 0 6px 12px rgba(130, 54, 0, .14);
    }

    .dots { display: flex; justify-content: center; gap: 6px; margin-top: -4px; margin-bottom: 14px; }
    .dot { width: 6px; height: 6px; border-radius: 999px; background: #ccd8e4; }
    .dot.active { width: 18px; background: #0075d7; }

    .tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 0 18px 20px;
    }
    .search {
      height: 52px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid #edf2f6;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 15px;
      color: #527083;
      font-size: 15px;
      font-weight: 850;
      box-shadow: 0 4px 12px rgba(31, 74, 112, .04);
    }
    .setting {
      height: 52px;
      padding: 0 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #0a6fc3;
      background: #e8f5ff;
      font-size: 15px;
      font-weight: 950;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(31, 74, 112, .04);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: 8px;
      row-gap: 26px;
      padding: 0 18px 26px;
    }
    .feature-item { font-size: 16px; }
    .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 17px;
      height: 17px;
      border-radius: 999px;
      background: #ff492e;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(255,73,46,.26);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(76px + var(--safe-bottom));
      padding: 9px 14px calc(7px + var(--safe-bottom));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,.98);
      border-top: 1px solid #eaf0f6;
      box-shadow: 0 -8px 22px rgba(33, 72, 112, .10);
      z-index: 20;
    }
    .nav-item {
      display: grid;
      place-items: center;
      gap: 4px;
      color: #9aa6b2;
      font-size: 12px;
      font-weight: 800;
    }
    .nav-item.active { color: #0074d8; font-weight: 950; }
    .nav-spacer { pointer-events: none; }

    .qr-float {
      position: fixed;
      left: 50%;
      bottom: calc(31px + var(--safe-bottom));
      transform: translateX(-50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(180deg, #0d94ef, #0062b6);
      border: 8px solid #e8f6ff;
      box-shadow: 0 9px 24px rgba(0, 91, 174, .28);
      z-index: 21;
    }
    .qr-inner {
      width: 38px;
      height: 38px;
      border: 2px solid rgba(255,255,255,.80);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 950;
      line-height: 1;
    }

    .assistive {
      position: fixed;
      right: 11px;
      bottom: calc(134px + var(--safe-bottom));
      width: 58px;
      height: 58px;
      border-radius: 50%;
      z-index: 18;
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.88), rgba(130,130,130,.72) 58%, rgba(65,65,65,.60));
      box-shadow: 0 7px 20px rgba(0,0,0,.20);
      opacity: .82;
    }

    @media (max-width: 360px) {
      .hero { padding-left: 14px; padding-right: 14px; }
      .main-card { margin-left: 14px; margin-right: 14px; }
      .quick-icon, .feature-icon { width: 50px; height: 50px; }
      .quick-item, .feature-item { font-size: 13px; }
      .greeting strong { font-size: 17px; }
      .help { display: none; }
      .setting span { display: none; }
    }

    @media (min-width: 768px) {
      body { background: #dcecf9; display: flex; justify-content: center; padding: 20px 0; }
      .app {
        max-width: 430px;
        min-height: calc(100vh - 40px);
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0,0,0,.20);
      }
      .bottom-nav {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        bottom: 20px;
        max-width: 430px;
        border-radius: 0 0 30px 30px;
      }
      .qr-float { bottom: 51px; }
      .assistive { right: calc(50% - 204px); bottom: 154px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="topbar">
        <div class="profile">
          <div class="brand">Bri<small>mo</small></div>
          <div class="greeting">Selamat Sore,<strong>M Andhika</strong></div>
        </div>
        <div class="top-actions">
          <button class="top-icon" aria-label="Notifikasi">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </button>
          <button class="help" aria-label="Pusat bantuan">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-7h3zM3 19a2 2 0 0 0 2 2h1v-7H3z"/></svg>
            <span>Pusat<br>Bantuan</span>
          </button>
        </div>
      </div>
    </section>

    <section class="main-card">
      <article class="blue-balance">
        <div class="balance-top">
          <p class="label">Saldo Rekening Utama</p>
          <div class="masked"><span>Rp928.000,00</span></div>
        </div>
        <div class="rekening">
          <span>Semua Rekeningmu</span>
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </div>
      </article>

      <div class="quick">
        <div class="quick-item">
          <div class="quick-icon"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H3"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h18"/></svg></div>
          <span>Transfer</span>
        </div>
        <div class="quick-item">
          <div class="quick-icon"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h7"/></svg></div>
          <span>BRIVA</span>
        </div>
        <div class="quick-item">
          <div class="quick-icon green"><svg width="31" height="31" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8 7 6 10.2 6 14a6 6 0 0 0 12 0c0-3.8-2-7-6-12z"/></svg></div>
          <span>PDAM</span>
        </div>
        <div class="quick-item">
          <div class="quick-icon green"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 7v7"/><path d="M9 10l3-3 3 3"/><path d="M11 18h2"/></svg></div>
          <span>Pulsa/<br>Data</span>
        </div>
      </div>
    </section>

    <section class="promo">
      <div>
        <strong>5 Cara Jadi Sultan Tanpa Warisan</strong>
        <span>Mulai investasi aman sejak sekarang</span>
      </div>
      <button class="promo-cta">Mulai</button>
    </section>

    <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>

    <section class="tools">
      <div class="search">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <span>Cari Fitur</span>
      </div>
      <button class="setting">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span>Atur Fitur</span>
      </button>
    </section>

    <section class="features">
      <div class="feature-item">
        <div class="feature-icon green"><span class="badge"></span><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="15" height="11" rx="2"/><path d="M7 13h.01"/><path d="M19 10h1.5a1.5 1.5 0 0 1 0 3H19"/></svg></div>
        <span>Top Up</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon green"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10M7 13h6"/><path d="M6 17h12"/></svg></div>
        <span>BRIZZI</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon"><span class="badge"></span><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10a2 2 0 0 1 2 2v18l-3-2-2 2-2-2-2 2-2-2-3 2V4a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div>
        <span>Tagihan</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H3"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h18"/></svg></div>
        <span>Transfer</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon pink"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></div>
        <span>Lifestyle</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M9 16h.01M12 16h.01M15 16h.01"/></svg></div>
        <span>Setor &<br>Tarik Tunai</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon orange"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <span>Catatan<br>Keuangan</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon orange"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3 0 4-8 7-8 2.5 0 3.5 7 6 7 2 0 2.5-4 5-4"/><path d="M5 21h14"/><circle cx="16" cy="8" r="3"/></svg></div>
        <span>Investasi</span>
      </div>
    </section>

    <div class="assistive" aria-hidden="true"></div>

    <div class="qr-float" aria-label="QR button">
      <div class="qr-inner">QRIS</div>
    </div>

    <nav class="bottom-nav" aria-label="Navigasi bawah">
      <button class="nav-item active"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/></svg><span>Home</span></button>
      <button class="nav-item"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span>Mutasi</span></button>
      <div class="nav-spacer"></div>
      <button class="nav-item"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15"><path d="M4 4h16v16H4z"/><path d="M4 8l8 5 8-5"/></svg><span>Aktivitas</span></button>
      <button class="nav-item"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg><span>Akun</span></button>
    </nav>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
